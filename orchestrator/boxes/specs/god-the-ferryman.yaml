box_id: god-the-ferryman
hosts:
  - name: portal
    image: ctf-boxes/god-the-ferryman-portal:latest
    front_door: true
    ports:
      - {container_port: 5000}
  - name: waystation
    image: ctf-boxes/god-the-ferryman-waystation:latest
    front_door: false
    # Unused by DockerBackend for internal-only hosts, required by
    # KubernetesBackend (see master-two-offices.yaml's backoffice entry).
    ports:
      - {container_port: 7000}
  - name: vault
    image: ctf-boxes/god-the-ferryman-vault:latest
    front_door: false
    ports:
      - {container_port: 22}
