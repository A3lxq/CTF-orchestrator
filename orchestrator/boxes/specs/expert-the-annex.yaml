box_id: expert-the-annex
hosts:
  - name: gateway
    image: ctf-boxes/expert-the-annex-gateway:latest
    front_door: true
    ports:
      - {container_port: 5000}
  - name: directory
    image: ctf-boxes/expert-the-annex-directory:latest
    front_door: false
    # Unused by DockerBackend for internal-only hosts, required by
    # KubernetesBackend (see master-two-offices.yaml's backoffice entry).
    ports:
      - {container_port: 389}
  - name: fileserver
    image: ctf-boxes/expert-the-annex-fileserver:latest
    front_door: false
    ports:
      - {container_port: 22}
