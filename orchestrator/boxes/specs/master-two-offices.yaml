box_id: master-two-offices
hosts:
  - name: frontdesk
    image: ctf-boxes/master-two-offices-frontdesk:latest
    front_door: true
    ports:
      - {container_port: 5000}
      - {container_port: 22}
  - name: backoffice
    image: ctf-boxes/master-two-offices-backoffice:latest
    front_door: false
    # Unused by DockerBackend for internal-only hosts (intra-bridge
    # traffic needs no explicit publish), but required by
    # KubernetesBackend -- a Service routes only the ports it's told
    # about, unlike a Docker bridge network.
    ports:
      - {container_port: 6000}
