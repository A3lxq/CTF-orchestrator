box_id: bonus-apex-cyber-defense
hosts:
  - name: apex-target
    image: ctf-boxes/bonus-apex-cyber-defense:latest
    front_door: true
    ports:
      - {container_port: 80}
      - {container_port: 21}
      - {container_port: 2222}
    pasv_range:
      container_min: 21100
      container_max: 21110
      env_min_var: PASV_MIN_PORT
      env_max_var: PASV_MAX_PORT
      env_address_var: PASV_ADDRESS
