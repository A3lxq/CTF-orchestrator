[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log

[program:app]
command=/opt/venv/bin/python3 /opt/app/app.py
directory=/opt/app
environment=CTF_SECRET="%(ENV_CTF_SECRET)s"
autorestart=true

[program:internal_health]
command=/opt/venv/bin/python3 /opt/app/internal_health.py
directory=/opt/app
environment=CTF_SECRET="%(ENV_CTF_SECRET)s"
autorestart=true

[program:imds]
command=/opt/venv/bin/python3 /opt/app/imds.py
directory=/opt/app
environment=CTF_SECRET="%(ENV_CTF_SECRET)s"
autorestart=true

[program:secretsmgr]
command=/opt/venv/bin/python3 /opt/app/secretsmgr.py
directory=/opt/app
environment=CTF_SECRET="%(ENV_CTF_SECRET)s"
autorestart=true

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
