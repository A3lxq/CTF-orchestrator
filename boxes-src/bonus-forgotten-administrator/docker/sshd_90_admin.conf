# Overrides the image's global PasswordAuthentication no (set in the
# Dockerfile) for exactly the accounts that need it: the real `admin`
# account (reachable once a player finds its password via the web
# app's IDOR + credential reuse) and the 8 honeypot accounts (real
# passwords, real auth, but a login shell that goes nowhere -- see
# cmatrix-trap.sh). `john` and `root` are deliberately absent from this
# list -- john has no SSH password at all, root login is disabled
# globally.
Match User admin,msharma_ops,k.delgado_qa,r.obrien_dev,t.nakamura_support,a.ferreira_design,p.wu_infra,legacy-ftp,backup-svc
    PasswordAuthentication yes
