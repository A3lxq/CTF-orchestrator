[global]
    workgroup = MERIDIAN
    server string = Meridian Systems Reception File Server
    security = user
    map to guest = Bad User
    guest account = nobody
    log level = 0

[reception]
    path = /srv/shares/reception
    guest ok = yes
    browseable = yes
    read only = yes

[ops-archive]
    path = /srv/shares/ops-archive
    guest ok = yes
    browseable = no
    read only = yes

[secure-ops]
    path = /srv/shares/secure-ops
    guest ok = no
    browseable = yes
    read only = yes
    valid users = svc_helpdesk
