services:
  frontproxy:
    build:
      context: .
      dockerfile: docker/frontproxy/Dockerfile
    container_name: halcyon-master-frontproxy
    environment:
      - CTF_SECRET=${CTF_SECRET}
    ports:
      - "8080:80"
    networks:
      - public-net
      - internal-net

  admin-api:
    build:
      context: .
      dockerfile: docker/admin-api/Dockerfile
    container_name: halcyon-master-admin-api
    environment:
      - CTF_SECRET=${CTF_SECRET}
    # Intentionally NO "ports:" here -- admin-api is reachable only from
    # frontproxy, over internal-net. Never exposed to the host. The
    # whole point of this box is that the ONLY way in is through
    # frontproxy's request-smuggling bug, not a direct connection.
    networks:
      - internal-net

networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true
